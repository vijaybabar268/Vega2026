<h2 class="text-center">Vehicles List</h2>

<div class="card" style="padding: 20px 20px;">
    <h3>Search</h3>
    <div class="form-group">
        <label for="make">Make</label>
        <select id="make" class="form-control" [(ngModel)]="query.makeId" (change)="onFilterChange()">
            <option value=""></option>
            <option *ngFor="let m of makes" value="{{ m.id }}"> {{ m.name }}</option>
        </select>
    </div>
    <button class="btn btn-sm btn-secondary mt-3" style="width:80px" (click)="resetFilter()">Reset</button>
</div>

<p class="mt-4">
    <a [routerLink]="['/vehicles/new']" class="btn btn-info">New Vehicle</a>
</p>

<table class="table table-bordered mt-4">
    <thead>
        <tr>
            <th>Id</th>
            <th (click)="sortBy('make')">Make</th>
            <th (click)="sortBy('model')">Model</th>
            <th (click)="sortBy('contactName')">Contact Name</th>
            <th>Action</th>    
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let v of vehicles">
            <td>{{ v.id }}</td>
            <td>{{ v.make.name }}</td>
            <td>{{ v.model.name }}</td>
            <td>{{ v.contact.name }}</td>
            <td>
                <a class="btn btn-info" [routerLink]="['/vehicles/', v.id]">Edit</a> | 
                <a class="btn btn-primary" (click)="delete(v.id)">Delete</a>
            </td>
        </tr>
    </tbody>
</table>
